<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; color: #333; padding: 30px; }
        header { text-align: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 2px solid #e0e4ec; }
        header h1 { color: #2c3e50; }
        .container { display: flex; gap: 30px; max-width: 1200px; margin: 0 auto; }
        .form-card, .table-card { background: #fff; border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-card { flex: 1; min-width: 320px; height: fit-content; }
        .table-card { flex: 2; overflow-x: auto; }
        h2 { margin-bottom: 20px; color: #34495e; border-left: 4px solid #3498db; padding-left: 10px; font-size: 1.2rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 600; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
        input:focus { border-color: #3498db; outline: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-primary { background-color: #2ecc71; color: white; }
        .btn-primary:hover { background-color: #27ae60; }
        .btn-secondary { background-color: #95a5a6; color: white; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e4ec; }
        th { background-color: #f8f9fa; color: #2c3e50; }
        .actions { display: flex; gap: 5px; }
        .action-btn { padding: 6px 10px; border: none; border-radius: 3px; cursor: pointer; font-size: 0.8rem; color: white; font-weight: bold; }
        .edit-btn { background-color: #f39c12; }
        .delete-btn { background-color: #e74c3c; }
        #notification { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 4px; color: white; font-weight: bold; display: none; z-index: 1000; }
        .success { background-color: #2ecc71; }
        .error { background-color: #e74c3c; }
    </style>
</head>
<body>

<header>
    <h1>Student Registration System</h1>
    <p>JDBC Architecture Front-End Control Panel</p>
</header>

<div class="container">
    <div class="form-card">
        <h2 id="form-title">Register New Student</h2>
        <form id="student-form">
            <input type="hidden" id="student-id">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="first-name" required placeholder="e.g., Arun">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="last-name" required placeholder="e.g., Kumar">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="e.g., arun@example.com">
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary">Save Record</button>
            <button type="button" id="cancel-btn" class="btn btn-secondary" onclick="resetForm()">Cancel Edit</button>
        </form>
    </div>

    <div class="table-card">
        <h2>Active Registry Database Rows</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email Address</th>
                <th>Enrollment Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="student-table-body">
            </tbody>
        </table>
    </div>
</div>

<div id="notification"></div>

<script src="app.js"></script>
</body>
</html>
